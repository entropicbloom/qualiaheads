<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>qualiaheads</title>
  <meta name="theme-color" content="#e3f2e2" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --mint: #e3f2e2;
      --mint-deep: #cfe7d2;
      --peach: #f6b27c;
      --orange: #ef8a5c;
      --sun: #f5d67f;
      --teal: #5fb9ab;
      --aqua: #93d4c7;
      --magenta: #c9548f;
      --ink: #3d4f46;
      --ink-soft: #6a7b71;

      --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
      --font-sans: "Quicksand", "Avenir Next", "Segoe UI", sans-serif;

      /* orb diameter: ~80% of the viewport height, capped so it never reaches the text */
      --d: min(80vh, 55vw);
    }

    /* registered so the gradient stops can interpolate */
    @property --c1 { syntax: '<color>'; inherits: false; initial-value: #f5d67f; }
    @property --c2 { syntax: '<color>'; inherits: false; initial-value: #93d4c7; }
    @property --c3 { syntax: '<color>'; inherits: false; initial-value: #5fb9ab; }
    @property --c4 { syntax: '<color>'; inherits: false; initial-value: #c9548f; }

    * { box-sizing: border-box; }
    html, body { height: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      background: var(--mint);
      color: var(--ink);
      font-family: var(--font-sans);
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--magenta); outline-offset: 5px; border-radius: 999px; }

    /* ---------- the orb ---------- */
    .anchor {
      position: fixed; z-index: 0; pointer-events: none;
      width: var(--d); height: var(--d);
      top: 50%; right: calc(var(--d) * -0.33);
      translate: 0 -50%;
    }
    .glow {
      position: absolute; inset: -34%;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(246,178,124,.52) 0%,
        rgba(245,214,127,.30) 32%,
        rgba(246,178,124,.10) 52%,
        rgba(227,242,226,0) 70%);
      animation: exhale 9s ease-in-out infinite;
      will-change: transform, opacity;
    }
    .orb {
      position: absolute; inset: 0;
      border-radius: 50%;
      --c1: #f5d67f; --c2: #93d4c7; --c3: #5fb9ab; --c4: #c9548f;
      background: linear-gradient(180deg, var(--c1) 0%, var(--c2) 38%, var(--c3) 70%, var(--c4) 100%);
      /* soft edge; the grain on top makes it speckle */
      -webkit-mask-image: radial-gradient(circle closest-side, #000 86%, rgba(0,0,0,.55) 94%, transparent 100%);
              mask-image: radial-gradient(circle closest-side, #000 86%, rgba(0,0,0,.55) 94%, transparent 100%);
      animation:
        inhale 9s ease-in-out infinite,
        palette-walk 60s ease-in-out infinite;
      will-change: transform;
    }
    .orb::after {
      /* a faint rim so it reads as a body, not a disc */
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 58%, rgba(255,255,255,.28) 100%);
    }

    @keyframes inhale {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }
    @keyframes exhale {
      0%, 100% { transform: scale(1.05); opacity: .95; }
      50%      { transform: scale(1);    opacity: .6; }
    }
    /* stops walk one step through sun -> aqua -> teal -> magenta -> peach, then home */
    @keyframes palette-walk {
      0%   { --c1: #f5d67f; --c2: #93d4c7; --c3: #5fb9ab; --c4: #c9548f; }
      20%  { --c1: #93d4c7; --c2: #5fb9ab; --c3: #c9548f; --c4: #f6b27c; }
      40%  { --c1: #5fb9ab; --c2: #c9548f; --c3: #f6b27c; --c4: #f5d67f; }
      60%  { --c1: #c9548f; --c2: #f6b27c; --c3: #f5d67f; --c4: #93d4c7; }
      80%  { --c1: #f6b27c; --c2: #f5d67f; --c3: #93d4c7; --c4: #5fb9ab; }
      100% { --c1: #f5d67f; --c2: #93d4c7; --c3: #5fb9ab; --c4: #c9548f; }
    }
    /* browsers without @property would snap between keyframes; hold the first state instead */
    .no-props .orb { animation: inhale 9s ease-in-out infinite; }

    .grain {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      opacity: .4; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.25  0 0 0 0 0.32  0 0 0 0 0.28  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      background-size: 220px 220px;
    }

    /* ---------- layout ---------- */
    .hero {
      position: relative; z-index: 1;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: clamp(18px, 3vw, 34px) clamp(20px, 5vw, 64px);
    }
    header { display: flex; align-items: center; }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      text-decoration: none; font-weight: 600; font-size: .98rem; letter-spacing: .04em;
      color: var(--ink);
    }
    .brand svg { width: 28px; height: 28px; }

    main {
      display: grid; align-content: center;
      padding: 4vh 0 8vh clamp(0px, 3vw, 48px);
    }
    .stack { max-width: 36rem; }

    h1 {
      font-family: var(--font-display);
      font-style: italic;
      font-variation-settings: "opsz" 120, "SOFT" 100, "WONK" 1;
      font-weight: 400;
      font-size: clamp(2.4rem, 5.6vw, 5rem);
      line-height: 1.02; letter-spacing: -.01em;
      margin: 0 0 .7em;
      text-wrap: balance;
    }
    h1 span {
      /* subtler rainbow: the palette hues, muted toward ink */
      background: linear-gradient(95deg, #c9765a 0%, #b1628b 52%, #5e9c92 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      padding: 0 .2em 0 .08em; margin: 0 -.2em 0 -.08em;
      -webkit-box-decoration-break: clone; box-decoration-break: clone;
    }

    .meetup {
      display: inline-grid; min-width: 16rem;
      padding-top: 14px;
      border-top: 1px solid rgba(61,79,70,.28);
    }
    .meetup .label {
      font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--ink-soft);
    }
    .meetup strong {
      font-family: var(--font-display); font-variation-settings: "opsz" 48, "SOFT" 100, "WONK" 1;
      font-weight: 500; font-size: 1.9rem; line-height: 1.15;
      margin-top: 4px; padding-bottom: 8px;
      border-bottom: 1px dashed rgba(61,79,70,.34);
    }

    /* ---------- entrance ---------- */
    .rise { opacity: 0; transform: translateY(10px); transition: opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.8,.2,1); }
    .loaded .rise { opacity: 1; transform: none; }
    .loaded .stack .rise:nth-child(2) { transition-delay: .25s; }
    .anchor.rise { transform: none; transition: opacity 1.6s ease; }

    /* ---------- mobile: orb sinks to the bottom ---------- */
    @media (max-width: 820px) {
      :root { --d: min(80vh, 118vw); }
      .anchor {
        top: auto; right: auto;
        left: 50%; bottom: calc(var(--d) * -0.36);
        translate: -50% 0;
      }
      main {
        padding: 2vh 0 calc(var(--d) * .64 + 28px);
      }
      .stack { max-width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb, .glow { animation: none !important; }
      .rise { transition: none; }
    }
  </style>
</head>
<body>
  <div class="anchor rise" aria-hidden="true">
    <div class="glow"></div>
    <div class="orb"></div>
  </div>

  <div class="hero">
    <header>
      <a class="brand" href="/" aria-label="qualiaheads home">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="bhead" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f6b27c"/><stop offset="1" stop-color="#ef8a5c"/>
            </linearGradient>
            <linearGradient id="borb" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f5d67f"/><stop offset=".4" stop-color="#93d4c7"/>
              <stop offset=".75" stop-color="#5fb9ab"/><stop offset="1" stop-color="#c9548f"/>
            </linearGradient>
          </defs>
          <path d="M22 196 V100 a78 78 0 0 1 156 0 V196 Z" fill="url(#bhead)"/>
          <circle cx="100" cy="96" r="46" fill="url(#borb)"/>
        </svg>
        <span>qualiaheads</span>
      </a>
    </header>

    <main>
      <div class="stack">
        <h1 class="rise"><span>Something it is like.</span></h1>

        <section class="meetup rise" id="meetup" aria-labelledby="meetup-label">
          <span class="label" id="meetup-label">Next meet-up</span>
          <strong>TBD</strong>
        </section>
      </div>
    </main>
  </div>

  <div class="grain" aria-hidden="true"></div>

  <script>
    if (!(window.CSS && CSS.registerProperty)) document.documentElement.classList.add('no-props');
    requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('loaded')));
  </script>
  <p class="origin-line" style="position:fixed; left:28px; bottom:22px; margin:0; z-index:4; pointer-events:none; font:600 .72rem/1.4 'Quicksand',sans-serif; color:#6a7b71; letter-spacing:.02em;"><span style="text-transform:uppercase; letter-spacing:.12em; font-size:.62rem; margin-right:.6em;">Origin</span>Institute of Neuroinformatics, Zürich</p>
</body>
</html>
