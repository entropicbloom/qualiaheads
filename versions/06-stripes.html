<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>qualiaheads</title>
  <meta name="theme-color" content="#e3f2e2" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --mint: #e3f2e2;
      --mint-deep: #cfe7d2;
      --peach: #f6b27c;
      --orange: #ef8a5c;
      --sun: #f5d67f;
      --teal: #5fb9ab;
      --aqua: #93d4c7;
      --magenta: #c9548f;
      --ink: #3d4f46;
      --ink-soft: #6a7b71;
      --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
      --font-sans: "Quicksand", "Avenir Next", "Segoe UI", sans-serif;
      --gap: 6px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      background: var(--mint);
      color: var(--ink);
      font-family: var(--font-sans);
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }
    :focus-visible { outline: 3px solid var(--magenta); outline-offset: 4px; }

    /* ---------- the wall of stripes ---------- */
    .wall {
      position: fixed; inset: 0; z-index: 0;
      display: flex; gap: var(--gap);
      padding: 0 var(--gap);
      background: var(--mint);
    }
    .band {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      height: 100%;
      background-size: 100% 220%;
      background-position: 50% 0%;
      animation:
        breathe var(--bd, 14s) ease-in-out var(--bdelay, 0s) infinite alternate,
        drift var(--gd, 40s) ease-in-out var(--gdelay, 0s) infinite alternate;
      overflow: hidden;
    }
    @keyframes breathe {
      from { flex-grow: var(--g0, 1); }
      to   { flex-grow: var(--g1, 1.6); }
    }
    @keyframes drift {
      from { background-position: 50% 0%; }
      to   { background-position: 50% 100%; }
    }

    /* gradients, all vertical, from the palette */
    .g1  { background-image: linear-gradient(180deg, var(--peach), var(--teal)); }
    .g2  { background-image: linear-gradient(180deg, var(--sun), var(--magenta)); }
    .g3  { background-image: linear-gradient(180deg, var(--aqua), var(--orange)); }
    .g4  { background-image: linear-gradient(180deg, var(--teal), var(--peach)); }
    .g5  { background-image: linear-gradient(180deg, var(--magenta), var(--sun)); }
    .g6  { background-image: linear-gradient(180deg, var(--orange), var(--aqua)); }
    .g7  { background-image: linear-gradient(180deg, var(--sun), var(--aqua), var(--teal), var(--magenta)); }
    .g8  { background-image: linear-gradient(180deg, var(--peach), var(--orange), var(--magenta)); }
    .g9  { background-image: linear-gradient(180deg, var(--aqua), var(--sun)); }
    .g10 { background-image: linear-gradient(180deg, var(--teal), var(--magenta)); }
    .g11 { background-image: linear-gradient(180deg, var(--sun), var(--peach), var(--teal)); }
    .g12 { background-image: linear-gradient(180deg, var(--magenta), var(--peach)); }

    /* shapes cut into or sitting on bands */
    .band .cut, .band .orb {
      position: absolute; left: 50%; translate: -50% 0;
      width: 82%; aspect-ratio: 1; border-radius: 50%;
    }
    .band .cut { background: var(--mint); }
    .band .arch {
      position: absolute; left: 50%; translate: -50% 0; bottom: 0;
      width: 70%; height: 30%;
      background: var(--mint);
      border-radius: 999px 999px 0 0;
    }
    .band .arch.top { bottom: auto; top: 0; border-radius: 0 0 999px 999px; }
    .band .orb {
      background: linear-gradient(180deg, var(--sun) 0%, var(--aqua) 38%, var(--teal) 72%, var(--magenta) 100%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
    }

    /* ---------- grain ---------- */
    .grain {
      position: fixed; inset: 0; z-index: 5; pointer-events: none;
      opacity: .42; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.25  0 0 0 0 0.32  0 0 0 0 0.28  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      background-size: 220px 220px;
    }

    /* ---------- content ---------- */
    .hero {
      position: relative; z-index: 2;
      height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      justify-items: center;
      padding: clamp(18px, 3vw, 32px) clamp(16px, 4vw, 48px) clamp(22px, 4vh, 40px);
    }
    .brand {
      justify-self: start;
      display: inline-flex; align-items: center; gap: 10px;
      padding: 8px 14px 8px 8px; border-radius: 999px;
      background: var(--mint);
      text-decoration: none; color: var(--ink);
      font-weight: 700; font-size: .95rem; letter-spacing: .02em;
    }
    .brand svg { width: 30px; height: 30px; display: block; }

    .title {
      align-self: center;
      position: relative;
      display: grid; justify-items: center; text-align: center;
      padding: clamp(28px, 5vh, 56px) clamp(32px, 6vw, 96px) clamp(22px, 4vh, 44px);
      border-radius: 46% 54% 52% 48% / 58% 62% 38% 42%;
      background: var(--mint);
      max-width: min(92vw, 1080px);
    }
    .title::before {
      content: ""; position: absolute; inset: -8px;
      border-radius: inherit;
      background: var(--mint); opacity: .55; z-index: -1;
    }
    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 400;
      font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1;
      font-size: clamp(3.2rem, 11.5vw, 10.5rem);
      line-height: .92;
      letter-spacing: -.02em;
      color: var(--ink);
      padding: 0 .06em;
    }
    .phrase {
      margin: .6em 0 0;
      font-size: clamp(.8rem, 1.1vw, .95rem);
      font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
      color: var(--ink-soft);
    }

    .meetup {
      justify-self: center;
      min-width: min(18rem, 100%);
      padding: 14px 24px 16px;
      border-radius: 22px;
      background: var(--mint);
      border: 1px solid rgba(61,79,70,.14);
      text-align: left;
    }
    .meetup .label {
      display: block; font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--ink-soft);
    }
    .meetup strong {
      display: block; font-family: var(--font-display);
      font-variation-settings: "opsz" 48, "SOFT" 100, "WONK" 1;
      font-weight: 500; font-size: 2rem; line-height: 1.1; margin-top: 2px;
    }

    /* ---------- entrance ---------- */
    .rise { opacity: 0; transform: translateY(12px); transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
    .loaded .rise { opacity: 1; transform: none; }
    .loaded .title.rise { transition-delay: .15s; }
    .loaded .meetup.rise { transition-delay: .25s; }

    @media (max-width: 640px) {
      :root { --gap: 4px; }
      .band:nth-child(n+15) { display: none; }
      h1 { font-size: clamp(3rem, 15vw, 4.2rem); }
      .title { padding: 26px 22px 20px; }
      .meetup { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .band { animation: none !important; flex-grow: var(--g0, 1) !important; }
      .rise { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wall" aria-hidden="true">
    <div class="band g1"  style="--g0:1.2; --g1:1.9; --bd:15s; --bdelay:-3s;  --gd:44s; --gdelay:-10s"></div>
    <div class="band g2"  style="--g0:.7;  --g1:1.3; --bd:18s; --bdelay:-7s;  --gd:38s; --gdelay:-25s"><div class="cut" style="top:14%"></div></div>
    <div class="band g3"  style="--g0:1.6; --g1:1.0; --bd:13s; --bdelay:-1s;  --gd:52s; --gdelay:-4s"></div>
    <div class="band g4"  style="--g0:.5;  --g1:1.1; --bd:21s; --bdelay:-11s; --gd:36s; --gdelay:-18s"></div>
    <div class="band g5"  style="--g0:1.1; --g1:1.7; --bd:16s; --bdelay:-5s;  --gd:48s; --gdelay:-30s"><div class="arch"></div></div>
    <div class="band g6"  style="--g0:.8;  --g1:1.5; --bd:19s; --bdelay:-9s;  --gd:41s; --gdelay:-2s"></div>
    <div class="band g7"  style="--g0:1.9; --g1:1.2; --bd:14s; --bdelay:-2s;  --gd:56s; --gdelay:-14s"><div class="orb" style="top:9%; width:60%"></div></div>
    <div class="band g8"  style="--g0:.6;  --g1:1.2; --bd:17s; --bdelay:-13s; --gd:39s; --gdelay:-22s"></div>
    <div class="band g9"  style="--g0:1.3; --g1:.8;  --bd:22s; --bdelay:-6s;  --gd:45s; --gdelay:-8s"><div class="arch top"></div></div>
    <div class="band g10" style="--g0:1.0; --g1:1.6; --bd:15s; --bdelay:-10s; --gd:50s; --gdelay:-33s"></div>
    <div class="band g11" style="--g0:.7;  --g1:1.4; --bd:20s; --bdelay:-4s;  --gd:37s; --gdelay:-12s"><div class="cut" style="bottom:16%"></div></div>
    <div class="band g12" style="--g0:1.5; --g1:.9;  --bd:12s; --bdelay:-8s;  --gd:47s; --gdelay:-27s"></div>
    <div class="band g3"  style="--g0:.9;  --g1:1.5; --bd:18s; --bdelay:-14s; --gd:42s; --gdelay:-6s"></div>
    <div class="band g1"  style="--g0:1.4; --g1:.8;  --bd:16s; --bdelay:-3s;  --gd:54s; --gdelay:-20s"><div class="orb" style="bottom:11%; width:64%"></div></div>
    <div class="band g5"  style="--g0:.6;  --g1:1.1; --bd:23s; --bdelay:-12s; --gd:40s; --gdelay:-35s"></div>
    <div class="band g9"  style="--g0:1.2; --g1:1.8; --bd:14s; --bdelay:-7s;  --gd:49s; --gdelay:-16s"><div class="arch"></div></div>
    <div class="band g6"  style="--g0:1.0; --g1:.6;  --bd:19s; --bdelay:-1s;  --gd:43s; --gdelay:-9s"></div>
    <div class="band g8"  style="--g0:.8;  --g1:1.4; --bd:17s; --bdelay:-15s; --gd:51s; --gdelay:-28s"></div>
    <div class="band g10" style="--g0:1.7; --g1:1.1; --bd:13s; --bdelay:-5s;  --gd:38s; --gdelay:-3s"><div class="cut" style="top:22%"></div></div>
    <div class="band g2"  style="--g0:.9;  --g1:1.5; --bd:21s; --bdelay:-9s;  --gd:46s; --gdelay:-24s"></div>
  </div>

  <div class="hero">
    <a class="brand" href="/" aria-label="qualiaheads home">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f6b27c"/><stop offset="1" stop-color="#ef8a5c"/>
          </linearGradient>
          <linearGradient id="og" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f5d67f"/><stop offset=".4" stop-color="#93d4c7"/>
            <stop offset=".75" stop-color="#5fb9ab"/><stop offset="1" stop-color="#c9548f"/>
          </linearGradient>
        </defs>
        <path d="M22 196 V100 a78 78 0 0 1 156 0 V196 Z" fill="url(#hg)"/>
        <circle cx="100" cy="96" r="46" fill="url(#og)"/>
      </svg>
      <span>qualiaheads</span>
    </a>

    <div class="title rise">
      <h1>qualiaheads</h1>
      <p class="phrase">Something it is like.</p>
    </div>

    <section class="meetup rise" aria-labelledby="meetup-label">
      <span class="label" id="meetup-label">Next meet-up</span>
      <strong>TBD</strong>
    </section>
  </div>

  <div class="grain" aria-hidden="true"></div>

  <script>
    const load = () => document.body.classList.add('loaded');
    requestAnimationFrame(() => requestAnimationFrame(load));
    setTimeout(load, 120);
  </script>
  <p class="origin-line" style="position:fixed; left:28px; bottom:22px; background:rgba(227,242,226,.85); padding:6px 12px; border-radius:999px; margin:0; z-index:4; pointer-events:none; font:600 .72rem/1.4 'Quicksand',sans-serif; color:#6a7b71; letter-spacing:.02em;"><span style="text-transform:uppercase; letter-spacing:.12em; font-size:.62rem; margin-right:.6em;">Origin</span>Institute of Neuroinformatics, Zürich</p>
</body>
</html>
